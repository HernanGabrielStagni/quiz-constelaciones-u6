<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evaluación — Constelaciones Familiares</title>
    <meta
      name="description"
      content="Evaluación de conocimientos sobre Constelaciones Familiares. Completa el formulario y responde las preguntas para obtener tu puntaje."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ========================================================
   RESET & BASE
   ======================================================== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0a0e1a;
        --surface: #111827;
        --card: #1a2236;
        --border: #2a3a55;
        --accent: #6c63ff;
        --accent2: #a78bfa;
        --teal: #22d3ee;
        --green: #4ade80;
        --red: #f87171;
        --text: #e2e8f0;
        --muted: #8b9ab4;
        --radius: 14px;
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
      }

      /* ========================================================
   VIDEO INTRO OVERLAY
   ======================================================== */
      #video-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.8s ease;
      }
      #video-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #intro-video {
        width: 100%;
        height: 100%;
        object-fit: contain; /* Cambiado de cover a contain para que encaje perfecto */
        background: #000;
      }

      /* ========================================================
   FONDO ANIMADO — ESTRELLAS
   ======================================================== */
      #stars-bg {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .star {
        position: absolute;
        border-radius: 50%;
        background: white;
        animation: twinkle var(--d, 7s) ease-in-out infinite;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(1);
        }
        50% {
          opacity: 0.85;
          transform: scale(1.3);
        }
      }

      /* ========================================================
   LAYOUT
   ======================================================== */
      #app {
        position: relative;
        z-index: 1;
        max-width: 820px;
        margin: 0 auto;
        padding: 1rem 1.25rem 4rem;
      }

      /* ========================================================
   SCREENS
   ======================================================== */
      .screen {
        display: none;
        animation: fadeUp 0.45s ease both;
      }
      .screen.active {
        display: block;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ========================================================
   HEADER / LOGO (Sticky)
   ======================================================== */
      .site-header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(10, 14, 26, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 0.75rem 0;
        text-align: center;
        margin-bottom: 2rem;
        transition: opacity 0.5s;
      }
      body:has(#video-overlay:not(.hidden)) .site-header {
        opacity: 0;
        pointer-events: none;
      }
      .logo-container {
        margin-bottom: 0.4rem;
      }
      .logo-container img {
        max-width: 120px;
        border-radius: 8px;
        filter: drop-shadow(0 0 8px rgba(108, 99, 255, 0.3));
      }
      .site-header .badge {
        display: inline-block;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #fff;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 0.2rem 0.6rem;
        border-radius: 100px;
        margin-bottom: 0.2rem;
      }
      .site-header h1 {
        font-family: "Outfit", sans-serif;
        font-size: 1.2rem;
        font-weight: 800;
        color: #fff;
        margin: 0;
      }
      .site-header p {
        font-size: 0.9rem;
        color: var(--muted);
        margin-top: 0.4rem;
        font-weight: 500;
      }

      /* ========================================================
   CARD
   ======================================================== */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 2rem;
        box-shadow: var(--shadow);
        margin-bottom: 1.5rem;
      }

      /* ========================================================
   FORMULARIO DE ALUMNO
   ======================================================== */
      .form-title {
        font-family: "Outfit", sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.1rem;
      }
      @media (max-width: 540px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }
      label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      input[type="text"],
      input[type="email"] {
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: 9px;
        color: var(--text);
        padding: 0.75rem 1rem;
        outline: none;
        width: 100%;
        transition: 0.2s;
      }
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
      }

      /* ========================================================
   BOTONES
   ======================================================== */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-family: "Outfit", sans-serif;
        font-size: 1rem;
        font-weight: 700;
        padding: 0.8rem 2rem;
        transition: 0.2s;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #fff;
        box-shadow: 0 4px 18px rgba(108, 99, 255, 0.45);
      }
      .btn-primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* ========================================================
   QUIZ ELEMENTS
   ======================================================== */
      .progress-wrap {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      .progress-bar-bg {
        flex: 1;
        height: 8px;
        background: var(--border);
        border-radius: 100px;
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        transition: 0.4s ease;
      }

      .q-head {
        display: flex;
        gap: 0.85rem;
        margin-bottom: 1.1rem;
      }
      .q-num {
        min-width: 36px;
        height: 36px;
        background: var(--accent);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }
      .q-text {
        font-size: 1rem;
        line-height: 1.5;
        padding-top: 5px;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }
      .opt {
        display: flex;
        gap: 0.75rem;
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: 10px;
        padding: 0.8rem 1rem;
        cursor: pointer;
        transition: 0.2s;
      }
      .opt:hover {
        border-color: var(--accent);
        transform: translateX(3px);
      }
      .opt.selected {
        border-color: var(--accent);
        background: rgba(108, 99, 255, 0.15);
      }
      .opt.correct {
        border-color: var(--green);
        background: rgba(74, 222, 128, 0.12);
      }
      .opt.incorrect {
        border-color: var(--red);
        background: rgba(248, 113, 113, 0.12);
      }
      .opt input {
        display: none;
      }

      #pendingSection {
        background: rgba(108, 99, 255, 0.08);
        padding: 1rem;
        border-radius: 10px;
        margin-top: 1.5rem;
      }
      #pendingList {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-top: 0.7rem;
      }
      .pending-item {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--surface);
        border: 1.5px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
      }

      .msg {
        padding: 1rem;
        border-radius: 10px;
        font-weight: 600;
        margin-top: 1.25rem;
        display: none;
      }
      .msg.ok {
        background: rgba(74, 222, 128, 0.15);
        color: var(--green);
        border-left: 5px solid var(--green);
      }
      .msg.warn {
        background: rgba(251, 191, 36, 0.1);
        color: #fbbf24;
        border-left: 5px solid #fbbf24;
      }
      .msg.err {
        background: rgba(248, 113, 113, 0.12);
        color: var(--red);
        border-left: 5px solid var(--red);
      }

      /* ========================================================
   RESULTS (Spectacular Cinematic Final)
   ======================================================== */
      #screen-result .card {
        background: radial-gradient(
          circle at top right,
          rgba(108, 99, 255, 0.15),
          var(--card)
        );
        overflow: hidden;
        position: relative;
        text-align: center;
        padding: 3rem 2rem;
      }
      .result-header {
        margin-bottom: 2rem;
      }
      .result-header h2 {
        font-family: "Outfit", sans-serif;
        font-size: 2.2rem;
        font-weight: 800;
        background: linear-gradient(to bottom, #fff, var(--muted));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .ring-wrap {
        position: relative;
        width: 220px;
        height: 220px;
        margin: 0 auto 2.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ring-container {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: conic-gradient(
          var(--accent) calc(var(--p, 0) * 3.6deg),
          var(--border) 0deg
        );
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 50px rgba(108, 99, 255, 0.3);
        transition: 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .ring-container::after {
        content: "";
        position: absolute;
        inset: 15px;
        background: var(--card);
        border-radius: 50%;
      }
      .ring-content {
        position: relative;
        z-index: 2;
        text-align: center;
      }
      .ring-content .pct {
        font-family: "Outfit", sans-serif;
        font-size: 3.8rem;
        font-weight: 900;
        line-height: 1;
        color: #fff;
        text-shadow: 0 0 20px rgba(108, 99, 255, 0.5);
      }
      .ring-content .sub {
        font-size: 0.85rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .rank-badge {
        display: inline-block;
        padding: 0.5rem 1.5rem;
        border-radius: 100px;
        background: linear-gradient(135deg, var(--accent), var(--teal));
        font-family: "Outfit";
        font-weight: 800;
        font-size: 0.9rem;
        color: #fff;
        margin-bottom: 2rem;
        box-shadow: 0 5px 20px rgba(108, 99, 255, 0.4);
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }

      /* ========================================================
   SCORE BOXES
   ======================================================== */
      .score-summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.25rem;
        margin-top: 1rem;
      }
      .score-box {
        background: rgba(255, 255, 255, 0.03);
        padding: 1.25rem 0.5rem;
        border-radius: 16px;
        border: 1px solid var(--border);
        transition: 0.3s;
      }
      .score-box:hover {
        border-color: var(--accent);
        background: rgba(108, 99, 255, 0.05);
      }
      .score-box .val {
        font-size: 1.7rem;
        font-weight: 800;
        color: #fff;
        display: block;
        margin-bottom: 2px;
      }
      .score-box .label {
        font-size: 0.7rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .final-feedback {
        margin: 2.5rem 0;
        font-size: 1.15rem;
        line-height: 1.7;
        font-style: italic;
        color: #e2e8f0;
        background: rgba(255, 255, 255, 0.05);
        padding: 2rem;
        border-radius: 20px;
        border-right: 4px solid var(--teal);
        border-left: 4px solid var(--accent);
      }

      .send-status {
        padding: 1rem;
        border-radius: 9px;
        margin-top: 1rem;
        font-size: 0.9rem;
        display: none;
      }
      .send-status.ok {
        color: var(--green);
      }
      .send-status.sending {
        color: var(--accent2);
      }

      body.locked .opt {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Video Overlay -->
    <div id="video-overlay">
      <video id="intro-video" playsinline>
        <source
          src="img/FINAL ANIMACION ESPACIO SEMILLAS.MP4"
          type="video/mp4"
        />
        Tu navegador no soporta video.
      </video>
      <script>
        if (
          performance.getEntriesByType("navigation")[0]?.type === "reload" &&
          sessionStorage.getItem("videoPlayed")
        ) {
          document.getElementById("video-overlay").style.display = "none";
        }
      </script>
    </div>

    <!-- Fondo de estrellas -->
    <div id="stars-bg"></div>

    <div id="app">
      <header class="site-header">
        <div class="logo-container">
          <img src="img/Logo espacio semillas.jpg" alt="Espacio Semillas" />
        </div>
        <div class="badge" id="quiz-unit-badge">Cargando...</div>
        <h1 id="quiz-course-title">Constelaciones Familiares</h1>
        <p id="quiz-module-subtitle"></p>
      </header>

      <!-- PANTALLA 1 — Datos -->
      <div id="screen-form" class="screen active">
        <div class="card">
          <form id="studentForm" novalidate>
            <div class="form-grid">
              <div class="field">
                <label>Nombre *</label>
                <input
                  type="text"
                  id="nombre"
                  required
                  placeholder="Tu nombre"
                />
              </div>
              <div class="field">
                <label>Apellido *</label>
                <input
                  type="text"
                  id="apellido"
                  required
                  placeholder="Tu apellido"
                />
              </div>
              <div class="field">
                <label>Email *</label>
                <input
                  type="email"
                  id="email"
                  required
                  placeholder="correo@ejemplo.com"
                />
              </div>
              <div class="field">
                <label>DNI *</label>
                <input
                  type="text"
                  id="dni"
                  required
                  placeholder="Solo números"
                />
              </div>
            </div>
            <button
              type="submit"
              class="btn btn-primary"
              style="width: 100%; margin-top: 2rem"
            >
              Comenzar Evaluación →
            </button>
          </form>
        </div>
      </div>

      <!-- PANTALLA 2 — Quiz -->
      <div id="screen-quiz" class="screen">
        <!-- Removida la barra de progreso superior por pedido del usuario -->
        <div id="quiz"></div>
        <div id="pendingSection" style="display: none">
          <strong>Preguntas sin responder:</strong>
          <div id="pendingList"></div>
        </div>
        <div id="message" class="msg"></div>

        <button
          class="btn btn-primary"
          id="scoreBtn"
          disabled
          style="width: 100%; margin-top: 2rem; padding: 1.2rem"
        >
          Calificar primer intento
        </button>

        <!-- RESULTADOS INTEGRADOS (Aparecen debajo de las preguntas) -->
        <div
          id="results-area"
          class="card"
          style="
            display: none;
            margin-top: 3rem;
            border-top: 4px solid var(--accent);
          "
        >
          <div class="result-header">
            <h2 id="result-title">Resultado Parcial</h2>
          </div>

          <div class="ring-wrap" style="width: 180px; height: 180px">
            <div class="ring-container" id="scoreRing">
              <div class="ring-content">
                <div class="pct" id="final-pct-display" style="font-size: 3rem">
                  0%
                </div>
                <div class="sub">Puntaje</div>
              </div>
            </div>
          </div>

          <div class="rank-badge" id="rankBadge">Evaluando...</div>

          <!-- Barra de resumen (Solo aparece en la segunda vuelta) -->
          <div id="final-summary-bar" style="display: none">
            <div class="score-summary">
              <div class="score-box">
                <span class="val" id="score1-val">0/15</span>
                <span class="label">Inicial</span>
              </div>
              <div class="score-box">
                <span class="val" id="score2-val">0/15</span>
                <span class="label">Corregido</span>
              </div>
              <div class="score-box">
                <span class="val" id="scoreAvg-val">0.0</span>
                <span class="label">Promedio</span>
              </div>
            </div>
            <div class="final-feedback" id="finalFeedback"></div>
          </div>

          <div class="send-status" id="sendStatus"></div>
        </div>
      </div>
    </div>

    <script>
      /**
       * CONFIGURACIÓN DEL QUIZ
       * Solo necesitas cambiar estos datos para actualizar la evaluación completa.
       */
      const QUIZ_CONFIG = {
        courseTitle: "Constelaciones Familiares",
        unitName: "Unidad 6",
        moduleSubtitle: "Vínculos entre padres e hijos",
        appsScriptUrl:
          "https://script.google.com/macros/s/AKfycbytfcpvZ0ysrjP7qYFZDt5GO4u4joxMhrTLcv82dPt7vHUPZdCXuqTELH1UJRpP_cUU/exec",
        questions: [
          {
            q: "1. ¿Qué patrón es dañino para el amor entre los padres y los hijos?",
            opts: [
              "a) Los hijos no toman nada por lealtad.",
              "b) Los hijos toman a sus padres tal y como son.",
              "c) Los padres no le dan a los hijos algo dañino.",
              "d) Los hijos rehúsan aceptar a los padres como son.",
            ],
            correct: 3,
          },
          {
            q: "2. ¿Qué significa el movimiento interrumpido?",
            opts: [
              "a) El progenitor se dirige al hijo para obtener lo que necesita.",
              "b) El hijo ya no se dirige al padre para obtener lo que necesita.",
              "c) El padre y el hijo se ignoran.",
              "d) El hijo se dirige a su padre para obtener lo que necesita.",
            ],
            correct: 1,
          },
          {
            q: "3. Un hijo interrumpe el movimiento hacia sus padres como consecuencia de:",
            opts: [
              "a) Tener hijos propios.",
              "b) Cuando es adulto.",
              "c) Un matrimonio.",
              "d) Una experiencia traumática y una desconfianza profunda.",
            ],
            correct: 3,
          },
          {
            q: "4. ¿Cómo se puede reparar el movimiento interrumpido?",
            opts: [
              "a) El hijo le dice a sus padres: 'Yo soy grande y vosotros pequeños'.",
              "b) El hijo le dice a sus padres: 'Por favor, abrazadme'.",
              "c) El hijo le dice a sus padres: 'Yo sigo mi propio camino'.",
              "d) El hijo le dice a sus padres: 'Yo honro vuestro destino'.",
            ],
            correct: 1,
          },
          {
            q: "5. ¿Deben estar presentes los niños durante una constelación?",
            opts: [
              "a) Sí.",
              "b) No.",
              "c) A veces.",
              "d) No y no necesitan saber nada al respecto.",
            ],
            correct: 3,
          },
          {
            q: "6. Se trata de parentificación cuando…",
            opts: [
              "a) Un hijo quiere darle algo a un padre o quiere hacer algo por él.",
              "b) Un padre pide ayuda emocional de sus hijos.",
              "c) Cuando hay un equilibrio entre dar y tomar.",
              "d) Cuando un hijo y sus padres han reñido.",
            ],
            correct: 0,
          },
          {
            q: "7. ¿Pertenecen las anteriores parejas al destino común?",
            opts: [
              "a) Sí, porque cronológicamente fueron primeras.",
              "b) No.",
              "c) Sí, porque han dejado un lugar libre para la pareja actual.",
              "d) Solamente cuando no hay hijos comunes y la pareja tiene un nuevo compañero.",
            ],
            correct: 2,
          },
          {
            q: "8. ¿Cuándo una mujer quiere un hijo sin querer tener pareja, crea una carga para al hijo?",
            opts: [
              "a) Sí, porque al hijo le faltará un padre.",
              "b) Sí, porque el hijo no estará libre para vivir su propia vida.",
              "c) No, ella quiere un hijo, por lo que el hijo viene para la madre.",
              "d) A veces.",
            ],
            correct: 1,
          },
          {
            q: "9. ¿Qué consecuencias tiene un padre innecesario o difícil para los hijos?",
            opts: [
              "a) Una exclusión sin ningún problema de comportamiento.",
              "b) Una exclusión con graves problemas de comportamiento.",
              "c) Ninguna exclusión.",
              "d) Movimiento interrumpido.",
            ],
            correct: 1,
          },
          {
            q: "10. ¿Son los padres compañeros, camaradas o amigos de los hijos?",
            opts: [
              "a) Sí.",
              "b) Amigos no pero sí compañeros y camaradas.",
              "c) Amigos sí, compañeros y camaradas no.",
              "d) No.",
            ],
            correct: 3,
          },
          {
            q: "11. ¿Pueden compartir detalles de su relación los padres con los hijos?",
            opts: [
              "a) Sí.",
              "b) No.",
              "c) Sólo cuando la relación es amistosa.",
              "d) Sólo cuando los hijos están involucrados con los problemas.",
            ],
            correct: 1,
          },
          {
            q: "12. ¿A qué se puede deber el mal comportamiento e hiperactividad de los hijos?",
            opts: [
              "a) A la lealtad de los hijos hacia los padres con conflictos.",
              "b) A la lealtad de los hijos hacia sus amigos.",
              "c) A la lealtad de los hijos hacia sus maestros.",
              "d) Ninguna de las opciones.",
            ],
            correct: 0,
          },
          {
            q: "13. Los hijos que rehúsan tomar a sus padres como son…",
            opts: [
              "a) Han dejado de acercarse a los padres debido a un divorcio.",
              "b) Han dejado de acercarse a los padres debido a una adopción.",
              "c) Han dejado de acercarse a los padres debido a una colocación en un hogar de niños.",
              "d) Todas las opciones.",
            ],
            correct: 3,
          },
          {
            q: "14. Un hijo toma la vida cuando…",
            opts: [
              "a) Se convierte en adulto.",
              "b) Cuando se honra a sí mismo.",
              "c) Cuando ve a sus ancestros con buenos ojos.",
              "d) Cuando honra a sus padres.",
            ],
            correct: 3,
          },
          {
            q: "15. ¿Qué tipo de dinámica surge debido al vínculo?",
            opts: [
              "a) El hijo como más débil sigue al más fuerte. ('Lo hago por ti.')",
              "b) El hijo como el más fuerte sigue al más débil. ('Tú lo haces por mí.')",
              "c) Parentificación.",
              "d) No surge ninguna dinámica.",
            ],
            correct: 0,
          },
        ],
      };

      // Alias para mantener compatibilidad con el resto del código
      const bank = QUIZ_CONFIG.questions;
      const APPS_SCRIPT_URL = QUIZ_CONFIG.appsScriptUrl;

      const feedbackPhrases = {
        high: [
          "¡Brillante! 🌟 Dominas los órdenes del amor con una claridad profunda. Sigue cultivando esta mirada sistémica.",
          "¡Excelente trabajo! Se nota tu compromiso con el aprendizaje. Tu comprensión ayudará a sanar vínculos.",
          "¡Increíble! Has integrado los conceptos con maestría. Sigue adelante con esta luz y sabiduría.",
        ],
        mid: [
          "¡Muy bien! 💫 Has aprobado y estás integrando los conceptos fundamentales. Hay una base sólida en ti.",
          "¡Buen desempeño! Lograste una comprensión clara. Te alentamos a seguir practicando esta nueva mirada.",
          "¡Aprobado! Estás en el camino correcto. Revisa los puntos donde dudaste para fortalecer tu sabiduría sistémica.",
        ],
        low: [
          "¡No te desanimes! 🌱 El camino de las constelaciones es un proceso de capas. Te invitamos a releer el material con calma.",
          "Cada error es una oportunidad para mirar algo nuevo. Te alentamos a profundizar en los conceptos y volver a intentar.",
          "Estás en proceso de aprendizaje. Toma este resultado como un estímulo para volver a mirar los órdenes del amor con nuevos ojos.",
        ],
      };

      let studentData = {};
      let score1 = 0;
      let score2 = 0;
      let attempts = 0;
      let locked = false;

      // CONTROL VIDEO
      window.addEventListener("DOMContentLoaded", () => {
        const overlay = document.getElementById("video-overlay");
        const video = document.getElementById("intro-video");

        // Función para ocultar overlay e inicializar títulos
        const skipVideo = () => {
          // Inicializar títulos dinámicos desde la configuración
          document.getElementById("quiz-unit-badge").textContent =
            QUIZ_CONFIG.unitName;
          document.getElementById("quiz-course-title").textContent =
            QUIZ_CONFIG.courseTitle;
          document.getElementById("quiz-module-subtitle").textContent =
            QUIZ_CONFIG.moduleSubtitle;

          overlay.classList.add("hidden");
          setTimeout(() => overlay.remove(), 1000);
        };

        try {
          let shouldPlay = true;
          const navEntries = performance.getEntriesByType("navigation");
          if (navEntries.length > 0) {
            const navType = navEntries[0].type;
            if (navType === "reload" && sessionStorage.getItem("videoPlayed")) {
              shouldPlay = false;
            }
          }

          if (shouldPlay) {
            overlay.classList.remove("hidden");

            // Intentar reproducir
            const playPromise = video.play();

            if (playPromise !== undefined) {
              playPromise
                .then(() => {
                  sessionStorage.setItem("videoPlayed", "true");
                })
                .catch((error) => {
                  console.log("Autoplay bloqueado:", error);
                  // En lugar de saltar, mostramos un botón para iniciar manualmente
                  // Esto cumple con "que la página continúe luego y no antes"
                  const playBtn = document.createElement("button");
                  playBtn.innerHTML = "<span>▶</span> Iniciar Introducción";
                  playBtn.className = "btn btn-primary";
                  playBtn.style.position = "absolute";
                  playBtn.style.zIndex = "10001";
                  playBtn.onclick = () => {
                    video.play();
                    playBtn.remove();
                  };
                  overlay.appendChild(playBtn);
                });
            }

            video.onended = skipVideo;

            // Solo saltar si hay un error crítico de carga
            video.onerror = () => {
              console.error("Error al cargar el video");
              skipVideo();
            };
          } else {
            skipVideo();
          }
        } catch (e) {
          console.error("Error en control de video:", e);
          skipVideo();
        }
      });

      function showScreen(id) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById(id).classList.add("active");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      document.getElementById("studentForm").addEventListener("submit", (e) => {
        e.preventDefault();

        const nombre = document.getElementById("nombre").value.trim();
        const apellido = document.getElementById("apellido").value.trim();
        const email = document.getElementById("email").value.trim();
        const dni = document.getElementById("dni").value.trim();

        // VALIDACIÓN ESTRICTA
        if (!nombre || !apellido || !email || !dni) {
          alert(
            "Todos los campos con '*' son obligatorios para registrar tu evaluación.",
          );
          return;
        }

        if (dni.length < 7) {
          alert("Por favor ingresa un DNI válido (mínimo 7 números).");
          return;
        }

        studentData = { nombre, apellido, email, dni };
        buildQuiz();
        showScreen("screen-quiz");
      });

      function buildQuiz() {
        const container = document.getElementById("quiz");
        container.innerHTML = "";
        bank.forEach((item, idx) => {
          const qDiv = document.createElement("div");
          qDiv.className = "card";
          qDiv.innerHTML = `
      <div class="q-head">
        <div class="q-num">${idx + 1}</div>
        <div class="q-text">${item.q}</div>
      </div>
      <div class="options" id="opts-${idx}">
        ${item.opts
          .map(
            (ot, i) => `
          <label class="opt">
            <input type="radio" name="q${idx}" value="${i}">
            <div class="label">${ot}</div>
          </label>
        `,
          )
          .join("")}
      </div>
    `;
          const inputs = qDiv.querySelectorAll("input");
          inputs.forEach((inp) => {
            inp.addEventListener("change", () => {
              qDiv
                .querySelectorAll(".opt")
                .forEach((o) => o.classList.remove("selected"));
              inp.closest(".opt").classList.add("selected");
              updateProgress();
            });
          });
          container.appendChild(qDiv);
        });
        updateProgress();
      }

      function updateProgress() {
        const answered = bank.filter((_, i) =>
          document.querySelector(`input[name="q${i}"]:checked`),
        ).length;
        document.getElementById("scoreBtn").disabled = answered < bank.length;

        const pendingList = document.getElementById("pendingList");
        pendingList.innerHTML = "";
        bank.forEach((_, i) => {
          if (!document.querySelector(`input[name="q${i}"]:checked`)) {
            const dot = document.createElement("div");
            dot.className = "pending-item";
            dot.textContent = i + 1;
            pendingList.appendChild(dot);
          }
        });
        document.getElementById("pendingSection").style.display =
          answered === bank.length ? "none" : "block";
      }

      document.getElementById("scoreBtn").addEventListener("click", () => {
        if (locked) return;

        let correct = 0;
        bank.forEach((item, i) => {
          const sel = +document.querySelector(`input[name="q${i}"]:checked`)
            .value;
          if (sel === item.correct) correct++;
        });

        const resultsArea = document.getElementById("results-area");
        resultsArea.style.display = "block";

        if (attempts === 0) {
          score1 = correct;
          const pct = Math.round((score1 / bank.length) * 100);

          // Marcar errores visuales
          bank.forEach((item, i) => {
            const selInput = document.querySelector(
              `input[name="q${i}"]:checked`,
            );
            const selValue = +selInput.value;
            const optWrapper = selInput.closest(".opt");

            // Limpiar estados anteriores
            optWrapper.classList.remove("incorrect", "correct");

            if (selValue !== item.correct) {
              optWrapper.classList.add("incorrect");
            }
          });

          updateRing(pct);
          document.getElementById("result-title").textContent =
            "Resultado Parcial";
          document.getElementById("scoreBtn").textContent =
            "Enviar Correcciones y Finalizar";

          // Desplazar suavemente hasta los resultados
          resultsArea.scrollIntoView({ behavior: "smooth" });
          attempts = 1;
        } else {
          score2 = correct;
          locked = true;
          document.body.classList.add("locked");

          const avg = (score1 + score2) / 2;
          const pctFinal = Math.round((avg / bank.length) * 100);

          // Mostrar resumen final
          document.getElementById("result-title").textContent =
            "Evaluación Finalizada";
          document.getElementById("final-summary-bar").style.display = "block";
          document.getElementById("scoreBtn").style.display = "none"; // Ocultar botón al finalizar

          document.getElementById("score1-val").textContent =
            `${score1}/${bank.length}`;
          document.getElementById("score2-val").textContent =
            `${score2}/${bank.length}`;
          document.getElementById("scoreAvg-val").textContent = avg.toFixed(1);

          updateRing(pctFinal);
          updateRank(pctFinal);

          resultsArea.scrollIntoView({ behavior: "smooth" });
          sendData(pctFinal, avg);
        }
      });

      function updateRing(pct) {
        const ring = document.getElementById("scoreRing");
        ring.style.setProperty("--p", pct);

        let currentPct = 0;
        const display = document.getElementById("final-pct-display");
        display.textContent = "0%";

        const interval = setInterval(() => {
          if (currentPct >= pct) {
            clearInterval(interval);
            display.textContent = pct + "%";
          } else {
            currentPct++;
            display.textContent = currentPct + "%";
          }
        }, 15);
      }

      function updateRank(pct) {
        const badge = document.getElementById("rankBadge");
        const feedback = document.getElementById("finalFeedback");
        let key = "low";

        if (pct >= 90) {
          key = "high";
          badge.textContent = "Maestría Sistémica";
          badge.style.background = "linear-gradient(135deg, #ffd700, #ffa500)";
        } else if (pct >= 70) {
          key = "mid";
          badge.textContent = "Sabiduría Integrada";
          badge.style.background =
            "linear-gradient(135deg, var(--accent), var(--teal))";
        } else {
          key = "low";
          badge.textContent = "Semilla en Crecimiento";
          badge.style.background = "linear-gradient(135deg, #4b5563, #374151)";
        }

        const pool = feedbackPhrases[key];
        feedback.textContent = pool[Math.floor(Math.random() * pool.length)];
      }

      function sendData(pct, avg) {
        const statusEl = document.getElementById("sendStatus");
        statusEl.style.display = "block";
        statusEl.className = "send-status sending";
        statusEl.textContent = "⏳ Guardando resultados...";

        const payload = {
          ...studentData,
          score1: score1,
          score2: score2,
          total: bank.length,
        };

        fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify(payload),
        })
          .then(() => {
            statusEl.className = "send-status ok";
            statusEl.textContent = "✅ Resultados guardados con éxito.";
          })
          .catch(() => {
            statusEl.style.color = "var(--red)";
            statusEl.textContent = "❌ Error al guardar. Avisa a tu docente.";
          });
      }

      // Estrellas
      (function initStars() {
        const c = document.getElementById("stars-bg");
        for (let i = 0; i < 80; i++) {
          const s = document.createElement("div");
          s.className = "star";
          const size = 1 + Math.random() * 2;
          s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;--d:${6 + Math.random() * 8}s;`;
          c.appendChild(s);
        }
      })();
    </script>
  </body>
</html>
