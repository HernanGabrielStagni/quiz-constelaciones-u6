<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evaluación — Constelaciones Familiares</title>
    <meta
      name="description"
      content="Evaluación de conocimientos sobre Constelaciones Familiares. Completa el formulario y responde las preguntas para obtener tu puntaje."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="video-overlay">
      <div id="intro-controls" class="intro-controls">
        <h3>Presentación</h3>
        <div class="controls-row">
          <button id="play-intro" class="ctrl-btn play">Iniciar</button>
          <button id="skip-intro" class="ctrl-btn skip">Saltar</button>
        </div>
      </div>
      <video id="intro-video" playsinline>
        <source
          src="img/FINAL ANIMACION ESPACIO SEMILLAS.MP4"
          type="video/mp4"
        />
        Tu navegador no soporta video.
      </video>
    </div>

    <!-- Fondo de estrellas -->
    <div id="stars-bg"></div>

    <div id="app">
      <header class="site-header">
        <div class="logo-container">
          <img src="img/Logo espacio semillas.jpg" alt="Espacio Semillas" />
        </div>
        <div class="badge" id="quiz-unit-badge">Cargando...</div>
        <h1 id="quiz-course-title">Constelaciones Familiares</h1>
        <p id="quiz-module-subtitle"></p>
      </header>

      <!-- PANTALLA 1 — Datos -->
      <div id="screen-form" class="screen active">
        <div class="card">
          <form id="studentForm" novalidate>
            <div class="form-grid">
              <div class="field">
                <label>Nombre *</label>
                <input
                  type="text"
                  id="nombre"
                  required
                  placeholder="Tu nombre"
                />
              </div>
              <div class="field">
                <label>Apellido *</label>
                <input
                  type="text"
                  id="apellido"
                  required
                  placeholder="Tu apellido"
                />
              </div>
              <div class="field">
                <label>Email</label>
                <input
                  type="email"
                  id="email"
                  placeholder="correo@ejemplo.com (Opcional)"
                />
              </div>
              <div class="field">
                <label>DNI *</label>
                <input
                  type="text"
                  id="dni"
                  required
                  placeholder="Solo números"
                />
              </div>
            </div>
            <button
              type="submit"
              id="startQuizBtn"
              class="btn btn-primary"
              disabled
              style="width: 100%; margin-top: 2rem"
            >
              Comenzar Evaluación →
            </button>
          </form>
        </div>
      </div>

      <!-- PANTALLA 2 — Quiz -->
      <div id="screen-quiz" class="screen">
        <!-- Removida la barra de progreso superior por pedido del usuario -->
        <div id="quiz"></div>
        <div id="pendingSection" style="display: none">
          <strong>Preguntas sin responder:</strong>
          <div id="pendingList"></div>
        </div>
        <div id="message" class="msg"></div>

        <button
          class="btn btn-primary"
          id="scoreBtn"
          disabled
          style="width: 100%; margin-top: 2rem; padding: 1.2rem"
        >
          Calificar primer intento
        </button>

        <!-- RESULTADOS PREMIUM (Estilo Stitch) -->
        <div id="results-area" class="results-screen" style="display: none">
          <div class="results-card">
            <h2 id="result-title">Resultado Parcial</h2>

            <!-- El Círculo Mágico de Progreso -->
            <div class="progress-container">
              <div class="ring-box">
                <svg width="160" height="160" viewBox="0 0 160 160">
                  <defs>
                    <linearGradient
                      id="grad1"
                      x1="0%"
                      y1="0%"
                      x2="100%"
                      y2="100%"
                    >
                      <stop
                        offset="0%"
                        style="stop-color: var(--teal); stop-opacity: 1"
                      />
                      <stop
                        offset="100%"
                        style="stop-color: var(--accent); stop-opacity: 1"
                      />
                    </linearGradient>
                  </defs>
                  <circle class="ring-bg" cx="80" cy="80" r="70"></circle>
                  <circle
                    id="ring-fill"
                    class="ring-fill"
                    cx="80"
                    cy="80"
                    r="70"
                    stroke-dasharray="440"
                    stroke-dashoffset="440"
                  ></circle>
                </svg>
                <div class="ring-text">
                  <span id="final-pct-display" class="pct-num">0%</span>
                  <span
                    id="final-grade-display"
                    class="grade-num"
                    style="display: none"
                    >0.0</span
                  >
                  <span class="pct-label">Puntaje</span>
                </div>
              </div>
            </div>

            <!-- Badge de Rango -->
            <div
              class="rank-container"
              id="rank-container"
              style="display: none"
            >
              <div id="rankBadge" class="rank-badge">Evaluando...</div>
            </div>

            <!-- Grid de Estadísticas (2 Cards: Intentos) -->
            <div id="final-stats-grid" class="stats-grid" style="display: none">
              <div class="stat-card">
                <span id="score1-grade" class="stat-grade">0.0</span>
                <span id="score1-pct" class="stat-pct">0%</span>
                <span id="score1-val" class="stat-val">0/15</span>
                <span class="stat-label">1° Intento</span>
              </div>
              <div class="stat-card">
                <span id="score2-grade" class="stat-grade">0.0</span>
                <span id="score2-pct" class="stat-pct">0%</span>
                <span id="score2-val" class="stat-val">0/15</span>
                <span class="stat-label">2° Intento</span>
              </div>
            </div>

            <div
              id="finalFeedback"
              class="final-feedback"
              style="display: none"
            ></div>
            <div id="sendStatus" class="send-status"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /**
       * CONFIGURACIÓN DEL QUIZ
       * Solo necesitas cambiar estos datos para actualizar la evaluación completa.
       */
      const QUIZ_CONFIG = {
        courseTitle: "Constelaciones Familiares",
        quizNumber: "6", // El número que aparece en la etiqueta superior
        unitName: "Unidad 6",
        moduleSubtitle: "Vínculos entre padres e hijos",
        appsScriptUrl:
          "https://script.google.com/macros/s/AKfycbytfcpvZ0ysrjP7qYFZDt5GO4u4joxMhrTLcv82dPt7vHUPZdCXuqTELH1UJRpP_cUU/exec",
        // Mapeo de soluciones fácil de editar: "Pregunta:Letra"
        solutionsMapping:
          "1:d, 2:b, 3:d, 4:b, 5:d, 6:a, 7:c, 8:b, 9:b, 10:d, 11:b, 12:a, 13:d, 14:d, 15:a",
        questions: [
          {
            q: "¿Qué patrón es dañino para el amor entre los padres y los hijos?",
            opts: [
              "a) Los hijos no toman nada por lealtad.",
              "b) Los hijos toman a sus padres tal y como son.",
              "c) Los padres no le dan a los hijos algo dañino.",
              "d) Los hijos rehúsan aceptar a los padres como son.",
            ],
          },
          {
            q: "¿Qué significa el movimiento interrumpido?",
            opts: [
              "a) El progenitor se dirige al hijo para obtener lo que necesita.",
              "b) El hijo ya no se dirige al padre para obtener lo que necesita.",
              "c) El padre y el hijo se ignoran.",
              "d) El hijo se dirige a su padre para obtener lo que necesita.",
            ],
          },
          {
            q: "Un hijo interrumpe el movimiento hacia sus padres como consecuencia de:",
            opts: [
              "a) Tener hijos propios.",
              "b) Cuando es adulto.",
              "c) Un matrimonio.",
              "d) Una experiencia traumática y una desconfianza profunda.",
            ],
          },
          {
            q: "¿Cómo se puede reparar el movimiento interrumpido?",
            opts: [
              "a) El hijo le dice a sus padres: 'Yo soy grande y vosotros pequeños'.",
              "b) El hijo le dice a sus padres: 'Por favor, abrazadme'.",
              "c) El hijo le dice a sus padres: 'Yo sigo mi propio camino'.",
              "d) El hijo le dice a sus padres: 'Yo honro vuestro destino'.",
            ],
          },
          {
            q: "¿Deben estar presentes los niños durante una constelación?",
            opts: [
              "a) Sí.",
              "b) No.",
              "c) A veces.",
              "d) No y no necesitan saber nada al respecto.",
            ],
          },
          {
            q: "Se trata de parentificación cuando…",
            opts: [
              "a) Un hijo quiere darle algo a un padre o quiere hacer algo por él.",
              "b) Un padre pide ayuda emocional de sus hijos.",
              "c) Cuando hay un equilibrio entre dar y tomar.",
              "d) Cuando un hijo y sus padres han reñido.",
            ],
          },
          {
            q: "¿Pertenecen las anteriores parejas al destino común?",
            opts: [
              "a) Sí, porque cronológicamente fueron primeras.",
              "b) No.",
              "c) Sí, porque han dejado un lugar libre para la pareja actual.",
              "d) Solamente cuando no hay hijos comunes y la pareja tiene un nuevo compañero.",
            ],
          },
          {
            q: "¿Cuándo una mujer quiere un hijo sin querer tener pareja, crea una carga para al hijo?",
            opts: [
              "a) Sí, porque al hijo le faltará un padre.",
              "b) Sí, porque el hijo no estará libre para vivir su propia vida.",
              "c) No, ella quiere un hijo, por lo que el hijo viene para la madre.",
              "d) A veces.",
            ],
          },
          {
            q: "¿Qué consecuencias tiene un padre innecesario o difícil para los hijos?",
            opts: [
              "a) Una exclusión sin ningún problema de comportamiento.",
              "b) Una exclusión con graves problemas de comportamiento.",
              "c) Ninguna exclusión.",
              "d) Movimiento interrumpido.",
            ],
          },
          {
            q: "¿Son los padres compañeros, camaradas o amigos de los hijos?",
            opts: [
              "a) Sí.",
              "b) Amigos no pero sí compañeros y camaradas.",
              "c) Amigos sí, compañeros y camaradas no.",
              "d) No.",
            ],
          },
          {
            q: "¿Pueden compartir detalles de su relación los padres con los hijos?",
            opts: [
              "a) Sí.",
              "b) No.",
              "c) Sólo cuando la relación es amistosa.",
              "d) Sólo cuando los hijos están involucrados con los problemas.",
            ],
          },
          {
            q: "¿A qué se puede deber el mal comportamiento e hiperactividad de los hijos?",
            opts: [
              "a) A la lealtad de los hijos hacia los padres con conflictos.",
              "b) A la lealtad de los hijos hacia sus amigos.",
              "c) A la lealtad de los hijos hacia sus maestros.",
              "d) Ninguna de las opciones.",
            ],
          },
          {
            q: "Los hijos que rehúsan tomar a sus padres como son…",
            opts: [
              "a) Han dejado de acercarse a los padres debido a un divorcio.",
              "b) Han dejado de acercarse a los padres debido a una adopción.",
              "c) Han dejado de acercarse a los padres debido a una colocación en un hogar de niños.",
              "d) Todas las opciones.",
            ],
          },
          {
            q: "Un hijo toma la vida cuando…",
            opts: [
              "a) Se convierte en adulto.",
              "b) Cuando se honra a sí mismo.",
              "c) Cuando ve a sus ancestros con buenos ojos.",
              "d) Cuando honra a sus padres.",
            ],
          },
          {
            q: "¿Qué tipo de dinámica surge debido al vínculo?",
            opts: [
              "a) El hijo como más débil sigue al más fuerte. ('Lo hago por ti.')",
              "b) El hijo como el más fuerte sigue al más débil. ('Tú lo haces por mí.')",
              "c) Parentificación.",
              "d) No surge ninguna dinámica.",
            ],
          },
        ],
      };

      // PROCESADOR DE CONFIGURACIÓN (Lógica automática)
      const bank = QUIZ_CONFIG.questions;
      const APPS_SCRIPT_URL = QUIZ_CONFIG.appsScriptUrl;

      // Traducir el mapeo humano (1:a) a índices de sistema (0, 1, 2...)
      (function parseSolutions() {
        const map = {};
        const pairs = QUIZ_CONFIG.solutionsMapping.split(",");
        pairs.forEach((p) => {
          const [qNum, letter] = p.trim().split(":");
          const index = letter.toLowerCase().charCodeAt(0) - 97; // a->0, b->1, c->2, d->3
          map[parseInt(qNum)] = index;
        });
        bank.forEach((q, i) => {
          q.correct = map[i + 1];
        });
      })();

      const feedbackPhrases = {
        high: [
          "¡Brillante! 🌟 Dominas los órdenes del amor con una claridad profunda. Sigue cultivando esta mirada sistémica.",
          "¡Excelente trabajo! Se nota tu compromiso con el aprendizaje. Tu comprensión ayudará a sanar vínculos.",
          "¡Increíble! Has integrado los conceptos con maestría. Sigue adelante con esta luz y sabiduría.",
        ],
        mid: [
          "¡Muy bien! 💫 Has aprobado y estás integrando los conceptos fundamentales. Hay una base sólida en ti.",
          "¡Buen desempeño! Lograste una comprensión clara. Te alentamos a seguir practicando esta nueva mirada.",
          "¡Aprobado! Estás en el camino correcto. Revisa los puntos donde dudaste para fortalecer tu sabiduría sistémica.",
        ],
        low: [
          "¡No te desanimes! 🌱 El camino de las constelaciones es un proceso de capas. Te invitamos a releer el material con calma.",
          "Cada error es una oportunidad para mirar algo nuevo. Te alentamos a profundizar en los conceptos y volver a intentar.",
          "Estás en proceso de aprendizaje. Toma este resultado como un estímulo para volver a mirar los órdenes del amor con nuevos ojos.",
        ],
      };

      let studentData = {};
      let score1 = 0;
      let score2 = 0;
      let attempts = 0;
      let locked = false;

      // CONTROL VIDEO
      window.addEventListener("DOMContentLoaded", () => {
        const overlay = document.getElementById("video-overlay");
        const video = document.getElementById("intro-video");

        // Función para ocultar overlay e inicializar títulos
        const skipVideo = () => {
          // Inicializar títulos dinámicos desde la configuración
          document.getElementById("quiz-unit-badge").textContent =
            `Quiz Evaluación #${QUIZ_CONFIG.quizNumber}`;
          document.getElementById("quiz-course-title").textContent =
            QUIZ_CONFIG.courseTitle;
          document.getElementById("quiz-module-subtitle").innerHTML =
            `<strong>${QUIZ_CONFIG.unitName}:</strong> ${QUIZ_CONFIG.moduleSubtitle}`;

          overlay.classList.add("hidden");
          sessionStorage.setItem("quizStarted", "true"); // Marcamos que ya pasó la intro
          setTimeout(() => overlay.remove(), 1000);
        };

        // Referencias a los botones nuevos
        const playBtn = document.getElementById("play-intro");
        const skipBtn = document.getElementById("skip-intro");
        const controls = document.getElementById("intro-controls");

        if (playBtn) {
          playBtn.onclick = () => {
            video.play();
            controls.style.display = "none";
          };
        }
        if (skipBtn) skipBtn.onclick = skipVideo;

        try {
          const navEntries = performance.getEntriesByType("navigation");
          const isReload =
            navEntries.length > 0 && navEntries[0].type === "reload";
          const alreadyStarted = sessionStorage.getItem("quizStarted");

          if (isReload && alreadyStarted) {
            // Solo saltamos si es un refresco Y ya se había pasado la intro antes
            skipVideo();
          } else {
            // En cualquier otro caso (visita nueva o refresco antes de empezar), mostramos intro
            overlay.classList.remove("hidden");
            video.onended = skipVideo;
            video.onerror = skipVideo;
          }
        } catch (e) {
          skipVideo();
        }
      });

      function showScreen(id) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById(id).classList.add("active");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // VALIDACIÓN DE FORMULARIO EN TIEMPO REAL
      const studentForm = document.getElementById("studentForm");
      const startBtn = document.getElementById("startQuizBtn");
      const inputs = ["nombre", "apellido", "dni"];

      const validateForm = () => {
        const isValid = inputs.every(
          (id) => document.getElementById(id).value.trim() !== "",
        );
        startBtn.disabled = !isValid;
      };

      inputs.forEach((id) => {
        document.getElementById(id).addEventListener("input", validateForm);
      });

      studentForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const nombre = document.getElementById("nombre").value.trim();
        const apellido = document.getElementById("apellido").value.trim();
        const email = document.getElementById("email").value.trim();
        const dni = document.getElementById("dni").value.trim();

        // VALIDACIÓN ESTRICTA (Email ya no es obligatorio, pero si se pone, se valida formato)
        if (!nombre || !apellido || !dni) {
          alert(
            "El Nombre, Apellido y DNI son campos obligatorios para registrar tu evaluación.",
          );
          return;
        }

        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          alert("Por favor ingresa un formato de email válido.");
          return;
        }

        if (dni.length < 7) {
          alert("Por favor ingresa un DNI válido (mínimo 7 números).");
          return;
        }

        studentData = { nombre, apellido, email, dni };
        buildQuiz();
        showScreen("screen-quiz");
      });

      function buildQuiz() {
        const container = document.getElementById("quiz");
        container.innerHTML = "";
        bank.forEach((item, idx) => {
          const qDiv = document.createElement("div");
          qDiv.className = "card";
          qDiv.innerHTML = `
      <div class="q-head">
        <div class="q-num">${idx + 1}</div>
        <div class="q-text">${item.q}</div>
      </div>
        <div id="opts-${idx}">
          ${item.opts
            .map((ot, i) => {
              // Resaltar la letra (a, b, c, d)
              const parts = ot.split(") ");
              const labelContent =
                parts.length > 1
                  ? `<strong>${parts[0]})</strong> ${parts.slice(1).join(") ")}`
                  : ot;
              return `
              <label class="opt" id="opt-${idx}-${i}">
                <input type="radio" name="q${idx}" value="${i}">
                <div class="label">${labelContent}</div>
              </label>
            `;
            })
            .join("")}
        </div>
    `;
          const inputs = qDiv.querySelectorAll("input");
          inputs.forEach((inp) => {
            inp.parentElement.addEventListener("click", (e) => {
              if (locked) return;
              e.preventDefault();

              const isChecked = inp.checked;

              // Limpiar estados de todos en el grupo (incluyendo correcciones visuales)
              qDiv.querySelectorAll(".opt").forEach((o) => {
                o.classList.remove("selected", "incorrect", "correct");
                o.style.opacity = "";
              });
              qDiv
                .querySelectorAll("input")
                .forEach((i) => (i.checked = false));

              if (!isChecked) {
                // Si no estaba marcado, lo marcamos
                inp.checked = true;
                inp.parentElement.classList.add("selected");
              }

              updateProgress();
            });
          });
          container.appendChild(qDiv);
        });
        updateProgress();
      }

      function updateProgress() {
        const answered = bank.filter((_, i) =>
          document.querySelector(`input[name="q${i}"]:checked`),
        ).length;
        document.getElementById("scoreBtn").disabled = answered < bank.length;

        const pendingList = document.getElementById("pendingList");
        pendingList.innerHTML = "";
        bank.forEach((_, i) => {
          if (!document.querySelector(`input[name="q${i}"]:checked`)) {
            const dot = document.createElement("div");
            dot.className = "pending-item";
            dot.textContent = i + 1;
            pendingList.appendChild(dot);
          }
        });
        document.getElementById("pendingSection").style.display =
          answered === bank.length ? "none" : "block";
      }

      document.getElementById("scoreBtn").addEventListener("click", () => {
        if (locked) return;

        let correct = 0;
        bank.forEach((item, i) => {
          const sel = +document.querySelector(`input[name="q${i}"]:checked`)
            .value;
          if (sel === item.correct) correct++;
        });

        const resultsArea = document.getElementById("results-area");
        resultsArea.style.display = "block";

        if (attempts === 0) {
          score1 = correct;
          const pct = Math.round((score1 / bank.length) * 100);

          // Marcar errores visuales
          bank.forEach((item, i) => {
            const selInput = document.querySelector(
              `input[name="q${i}"]:checked`,
            );
            const selValue = +selInput.value;
            const optWrapper = selInput.closest(".opt");

            // Limpiar estados anteriores
            optWrapper.classList.remove("incorrect", "correct");

            if (selValue !== item.correct) {
              optWrapper.classList.add("incorrect");
            }
          });

          updateRing(pct, `${score1}/${bank.length}`, "Puntaje");
          document.getElementById("result-title").textContent =
            "Resultado Parcial";
          document.getElementById("scoreBtn").textContent =
            "Enviar Correcciones y Finalizar";

          // Activar estilo de "repetición/corrección"
          document.getElementById("quiz").classList.add("repeating");

          // Desplazar suavemente hasta los resultados
          resultsArea.scrollIntoView({ behavior: "smooth" });
          attempts = 1;
        } else {
          score2 = correct;
          locked = true;
          document.body.classList.add("locked");

          // Marcar respuestas finales (Verdes y Rojas)
          bank.forEach((item, i) => {
            const selInput = document.querySelector(
              `input[name="q${i}"]:checked`,
            );
            const selValue = +selInput.value;
            const optWrapper = selInput.closest(".opt");

            // Limpiar estados anteriores
            optWrapper.classList.remove("incorrect", "correct");

            if (selValue === item.correct) {
              optWrapper.classList.add("correct");
            } else {
              optWrapper.classList.add("incorrect");
              // Marcar también cuál era la correcta para que el alumno aprenda
              const correctOpt = document.getElementById(
                `opt-${i}-${item.correct}`,
              );
              correctOpt.classList.add("correct");
              correctOpt.style.opacity = "0.8"; // Brillo suave para la correcta no elegida
            }
          });

          const grade1 = (score1 / bank.length) * 10;
          const grade2 = (score2 / bank.length) * 10;
          const avgGrade = (grade1 + grade2) / 2;
          const pctFinal = Math.round((avgGrade / 10) * 100);

          // Mostrar resumen final con elegancia
          document.getElementById("result-title").textContent =
            "Evaluación Finalizada";
          document.getElementById("final-stats-grid").style.display = "grid";
          document.getElementById("rank-container").style.display = "block";
          document.getElementById("finalFeedback").style.display = "block";
          document.getElementById("scoreBtn").style.display = "none";

          // Llenar Tarjetas
          document.getElementById("score1-grade").textContent =
            grade1.toFixed(1);
          document.getElementById("score1-pct").textContent =
            `${Math.round((score1 / bank.length) * 100)}%`;
          document.getElementById("score1-val").textContent =
            `${score1}/${bank.length}`;

          document.getElementById("score2-grade").textContent =
            grade2.toFixed(1);
          document.getElementById("score2-pct").textContent =
            `${Math.round((score2 / bank.length) * 100)}%`;
          document.getElementById("score2-val").textContent =
            `${score2}/${bank.length}`;

          updateRing(pctFinal, avgGrade.toFixed(1), "Promedio");
          updateRank(pctFinal);

          resultsArea.scrollIntoView({ behavior: "smooth" });
          sendData(pctFinal, avgGrade);
        }
      });

      function updateRing(pct, middleValue = null, label = "Puntaje") {
        const ringFill = document.getElementById("ring-fill");
        const pctDisplay = document.getElementById("final-pct-display");
        const gradeDisplay = document.getElementById("final-grade-display");
        const labelDisplay = document.querySelector(".pct-label");

        const circumference = 440;
        const offset = circumference - (pct / 100) * circumference;
        ringFill.style.strokeDashoffset = offset;

        labelDisplay.textContent = label;

        if (middleValue !== null) {
          // Estado Final: Mostramos ambos
          pctDisplay.textContent = pct + "%";
          gradeDisplay.textContent = middleValue;
          gradeDisplay.style.display = "block";
        } else {
          // Estado Parcial: Solo porcentaje
          gradeDisplay.style.display = "none";
          let currentPct = 0;
          const interval = setInterval(() => {
            if (currentPct >= pct) {
              clearInterval(interval);
              pctDisplay.textContent = pct + "%";
            } else {
              currentPct++;
              pctDisplay.textContent = currentPct + "%";
            }
          }, 15);
        }
      }

      function updateRank(pct) {
        const badge = document.getElementById("rankBadge");
        const feedback = document.getElementById("finalFeedback");
        let key = "low";

        if (pct >= 90) {
          key = "high";
          badge.textContent = "Maestría Sistémica";
          badge.style.background = "linear-gradient(135deg, #ffd700, #ffa500)";
        } else if (pct >= 70) {
          key = "mid";
          badge.textContent = "Sabiduría Integrada";
          badge.style.background =
            "linear-gradient(135deg, var(--accent), var(--teal))";
        } else {
          key = "low";
          badge.textContent = "Semilla en Crecimiento";
          badge.style.background = "linear-gradient(135deg, #4b5563, #374151)";
        }

        const pool = feedbackPhrases[key];
        feedback.textContent = pool[Math.floor(Math.random() * pool.length)];
      }

      function sendData(pct, avg) {
        const statusEl = document.getElementById("sendStatus");
        statusEl.style.display = "block";
        statusEl.className = "send-status sending";
        statusEl.textContent = "⏳ Guardando resultados...";

        const payload = {
          ...studentData,
          score1: score1,
          score2: score2,
          total: bank.length,
        };

        fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify(payload),
        })
          .then(() => {
            statusEl.className = "send-status ok";
            statusEl.textContent = "✅ Resultados guardados con éxito.";
          })
          .catch(() => {
            statusEl.style.color = "var(--red)";
            statusEl.textContent = "❌ Error al guardar. Avisa a tu docente.";
          });
      }

      // Estrellas
      (function initStars() {
        const c = document.getElementById("stars-bg");
        for (let i = 0; i < 80; i++) {
          const s = document.createElement("div");
          s.className = "star";
          const size = 1 + Math.random() * 2;
          s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;--d:${6 + Math.random() * 8}s;`;
          c.appendChild(s);
        }
      })();
    </script>
  </body>
</html>
